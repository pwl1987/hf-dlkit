name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 是 Ubuntu 22.04 的默认版本，必须覆盖；
        # 3.9 是本库声称支持的最低版本。
        python: ["3.9", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: CLI smoke test
        run: |
          hfdl --version
          hfdl --help

  integration:
    name: e2e download (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Real download via curl
        run: python integration/smoke.py --use-curl

      - name: Real download via pure-Python fallback
        run: python integration/smoke.py --no-curl

      - name: Report
        if: always()
        run: python integration/smoke.py --use-curl --keep || true

  legacy-setuptools:
    name: 老 setuptools（Debian/Ubuntu 场景）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 复现 Debian 11 / Ubuntu 20.04 的构建环境：
      # setuptools 59.6 不认 PEP 621 的 [project] 表，会装出一个
      # 叫 UNKNOWN-0.0.0 的空包。setup.py 垫片就是为了这个场景。
      - name: 降级到 setuptools 59.6（< 61，不支持 PEP 621）
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==59.6.0" wheel
          python -m pip install --no-build-isolation .

      - name: 验证装到的是 hf-dlkit 而不是 UNKNOWN
        run: |
          python -c "import hfdl; print('hfdl', hfdl.__version__)"
          hfdl --version
          python -c "import importlib.metadata as m; print(m.version('hf-dlkit'))"
